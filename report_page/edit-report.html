<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Report</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/report.css">
    <!-- TODO: Replace with actual Freepik CSS CDN link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@2.4.0/css/all/all.min.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <a href="#" id="back-to-confirm" class="back-button">
                <i class="fi fi-sr-arrow-left"></i>
            </a>
        </header>
        <main>
            <h1>Edit the details below</h1>
            <form>
                <label for="reason">Reason</label>
                <textarea id="reason" name="reason" rows="4">Multiple keywords related to gambling promotion and illegal betting were detected.</textarea>

                <h3>Detected Keywords</h3>
                <div class="keyword-input-group">
                    <input type="text" id="new-keyword-input" placeholder="New keyword">
                    <button type="button" class="btn-primary" id="add-keyword-button">Add</button>
                </div>
                <div id="keyword-list-editable" class="keyword-list-editable">
                    <!-- Keywords will be dynamically inserted here -->
                </div>

                <div class="button-group">
                    <button type="button" class="btn-primary" id="confirm-edit-button">Confirm</button>
                </div>
            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_client.js"></script>
    <script src="js/edit.js"></script>
</body>
</html>

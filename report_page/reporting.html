<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고 진행중</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/analysis.css">
    <!-- TODO: Replace with actual Freepik CSS CDN link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@2.4.0/css/all/all.min.css">
</head>
<body>
    <div class="container">
        <main class="centered-main">
            <div class="analysis-content">

                <div class="text-content">
                    <h1>신고 진행중...</h1>
                    <p>신고에 필요한 정보를 조합하여<br>신고를 진행하고 있어요</p>
                </div>
                <button type="button" class="btn-secondary" id="cancel-button">취소하기</button>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_client.js"></script>
    <script src="js/reporting.js"></script>

</html>

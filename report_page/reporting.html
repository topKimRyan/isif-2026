<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Submitting</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/analysis.css">
    <!-- TODO: Replace with actual Freepik CSS CDN link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@2.4.0/css/all/all.min.css">
</head>
<body>
    <div class="container">
        <main class="centered-main">
            <div class="analysis-content">
                <div class="icon-group">
                    <img src="img/loading.png" alt="Loading spinner" class="loading-spinner-icon"/>
                    <i class="fi fi-sr-paper-plane" alt="Report icon"></i>
                </div>
                <div class="text-content">
                    <h1>Submitting Report...</h1>
                    <p>Gathering the information needed<br>and submitting your report</p>
                </div>
                <button type="button" class="btn-secondary" id="cancel-button">Cancel</button>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_client.js"></script>
    <script src="js/reporting.js"></script>
</body>
</html>

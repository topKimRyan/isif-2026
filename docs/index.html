<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illegal Gambling Site Reporting Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚨 Illegal Gambling Site Reporting Dashboard</h1>
            <p>List of illegal gambling sites detected by AI</p>
        </header>

        <!-- Statistics section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-label">Total Illegal Sites</div>
                <div class="stat-value" id="total-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg. Confidence</div>
                <div class="stat-value" id="avg-confidence">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Updated</div>
                <div class="stat-value" id="last-update">-</div>
            </div>
        </div>

        <!-- Search & filter section -->
        <div class="search-section">
            <input type="text" id="search-input" placeholder="Search by URL or keyword...">
            <button id="refresh-btn" onclick="loadData()">🔄 Refresh</button>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">Loading data...</div>

        <!-- Error message -->
        <div id="error" class="error" style="display: none;"></div>

        <!-- Table section -->
        <div class="table-container">
            <table id="sites-table">
                <thead>
                    <tr>
                        <th>Icon</th>
                        <th>URL</th>
                        <th>Search Keyword</th>
                        <th>Confidence</th>
                        <th>Collected At</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="sites-tbody">
                    <!-- Data inserted by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Detail modal -->
    <div id="detail-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Details</h2>
            <div id="modal-body">
                <!-- Detail content inserted by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Supabase JavaScript client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
